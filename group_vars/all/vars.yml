---
# scope, level 1 only
rhel9cis_level_1: true
rhel9cis_level_2: false

# fixed constraint, unlocks a cluster
# of level 1 controls that are off by default
rhel9cis_disruption_high: true

# Warning banner
rhel9cis_warning_banner: "AIRNAV EXAM NODE - HANS - AUTHORIZED USE ONLY"

# PAM Faillock account disabled
rhel9cis_rule_5_3_3_1_1: false
rhel9cis_rule_5_3_3_1_2: false

# authselect custom profile is set
# since it failed without this
rhel9cis_authselect_custom_profile_name: terminated_si_hans

# GNOME
rhel9cis_gui: true
rhel9cis_set_boot_profile: "workstation"
rhel9cis_workstation: true
rhel9cis_xwindows_required: true
rhel9cis_gdm_required: true

# gdm
rhel9cis_rule_1_8_1: false
rhel9cis_rule_1_8_2: false
rhel9cis_rule_1_8_3: false
rhel9cis_rule_1_8_4: false
rhel9cis_rule_1_8_5: false
rhel9cis_rule_1_8_6: false
rhel9cis_rule_1_8_7: false
rhel9cis_rule_1_8_8: false
rhel9cis_rule_1_8_9: false
rhel9cis_rule_1_8_10: false

# maybe since the packages aren't stock
rhel9cis_rule_1_2_2_1: false

# enable goss audit
setup_audit: true
run_audit: true
fetch_audit_output: true
audit_output_destination: "./"
